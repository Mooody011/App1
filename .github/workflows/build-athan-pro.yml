          package com.athan.pro.widget

          import android.app.PendingIntent
          import android.appwidget.AppWidgetManager
          import android.appwidget.AppWidgetProvider
          import android.content.ComponentName
          import android.content.Context
          import android.content.Intent
          import android.widget.RemoteViews
          import com.athan.pro.MainActivity
          import com.athan.pro.R
          import com.athan.pro.data.HijriCalendar
          import com.athan.pro.data.PrayerCalculator
          import com.athan.pro.data.PrayerId
          import com.athan.pro.data.PrefsManager
          import java.text.SimpleDateFormat
          import java.util.Calendar
          import java.util.Date
          import java.util.Locale

          class PrayerWidgetProvider : AppWidgetProvider() {
              override fun onUpdate(context: Context, appWidgetManager: AppWidgetManager, appWidgetIds: IntArray) {
                  for (id in appWidgetIds) {
                      updateSingleWidget(context, appWidgetManager, id)
                  }
              }

              companion object {
                  fun updateAll(context: Context) {
                      val mgr = AppWidgetManager.getInstance(context)
                      val ids = mgr.getAppWidgetIds(ComponentName(context, PrayerWidgetProvider::class.java))
                      for (id in ids) {
                          updateSingleWidget(context, mgr, id)
                      }
                  }

                  private fun updateSingleWidget(context: Context, mgr: AppWidgetManager, widgetId: Int) {
                      val prefs = PrefsManager(context)
                      val cal = Calendar.getInstance()
                      val dayTimes = PrayerCalculator.calculateForDate(
                          cal.get(Calendar.YEAR),
                          cal.get(Calendar.MONTH) + 1,
                          cal.get(Calendar.DAY_OF_MONTH),
                          prefs.latitude,
                          prefs.longitude,
                          PrayerCalculator.currentTimeZoneHours(),
                          prefs.calculationMethod,
                          prefs.asrJuristic,
                          prefs.getAllOffsets()
                      )
                      val hijri = HijriCalendar.fromGregorian(cal, prefs.hijriAdjustment)
                      val fmt = SimpleDateFormat("hh:mm a", Locale("ar"))
                      val now = System.currentTimeMillis()
                      val nextEntry = PrayerId.entries.firstOrNull { (dayTimes.times[it] ?: 0L) > now }
                      val nextText = if (nextEntry != null) {
                          val t = fmt.format(Date(dayTimes.times[nextEntry]!!))
                          "القادمة: ${nextEntry.arabicName} ($t)"
                      } else {
                          "القادمة: الفجر غداً"
                      }

                      val rowText = listOf(PrayerId.FAJR, PrayerId.DHUHR, PrayerId.ASR, PrayerId.MAGHRIB, PrayerId.ISHA)
                          .joinToString(" | ") { p ->
                              val shortTime = SimpleDateFormat("HH:mm", Locale.US).format(Date(dayTimes.times[p] ?: 0L))
                              "${p.arabicName} $shortTime"
                          }

                      val views = RemoteViews(context.packageName, R.layout.prayer_widget).apply {
                          setTextViewText(R.id.widget_city, prefs.cityName)
                          setTextViewText(R.id.widget_hijri, "${hijri.day} ${hijri.monthName} ${hijri.year}")
                          setTextViewText(R.id.widget_next_prayer, nextText)
                          setTextViewText(R.id.widget_prayers_row, rowText)

                          val pi = PendingIntent.getActivity(
                              context, 0, Intent(context, MainActivity::class.java),
                              PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE
                          )
                          setOnClickPendingIntent(R.id.widget_root, pi)
                      }
                      mgr.updateAppWidget(widgetId, views)
                  }
              }
          }
