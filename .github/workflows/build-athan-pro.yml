          package com.athan.pro.alarm

          import android.content.BroadcastReceiver
          import android.content.Context
          import android.content.Intent
          import androidx.core.content.ContextCompat
          import com.athan.pro.data.AlertMode
          import com.athan.pro.widget.PrayerWidgetProvider

          class AthanAlarmReceiver : BroadcastReceiver() {
              override fun onReceive(context: Context, intent: Intent) {
                  val prayerName = intent.getStringExtra("prayer_name") ?: "الصلاة"
                  val modeId = intent.getIntExtra("alert_mode", AlertMode.ATHAN_FULL.id)

                  val serviceIntent = Intent(context, AthanService::class.java).apply {
                      action = AthanService.ACTION_START_ATHAN
                      putExtra("prayer_name", prayerName)
                      putExtra("alert_mode", modeId)
                  }
                  ContextCompat.startForegroundService(context, serviceIntent)

                  AthanScheduler.scheduleAll(context)
                  PrayerWidgetProvider.updateAll(context)
              }
          }
