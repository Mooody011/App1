          cat << 'EOF' > alarm/AthanService.kt
          package com.athan.pro.alarm

          import android.app.Notification
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.PendingIntent
          import android.app.Service
          import android.content.Intent
          import android.media.AudioAttributes
          import android.media.MediaPlayer
          import android.media.RingtoneManager
          import android.net.Uri
          import android.os.Handler
          import android.os.IBinder
          import android.os.Looper
          import androidx.core.app.NotificationCompat
          import com.athan.pro.MainActivity
          import com.athan.pro.data.AlertMode
          import com.athan.pro.data.PrefsManager

          class AthanService : Service() {
              companion object {
                  const val ACTION_START_ATHAN = "com.athan.pro.ACTION_START_ATHAN"
                  const val ACTION_STOP_ATHAN = "com.athan.pro.ACTION_STOP_ATHAN"
                  private const val CHANNEL_ID = "athan_pro_alarm_channel"
                  private const val NOTIF_ID = 777
              }

              private var mediaPlayer: MediaPlayer? = null
              private val handler = Handler(Looper.getMainLooper())

              override fun onBind(intent: Intent?): IBinder? = null

              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
                  if (intent?.action == ACTION_STOP_ATHAN) {
                      stopPlayback()
                      stopForeground(STOP_FOREGROUND_REMOVE)
                      stopSelf()
                      return START_NOT_STICKY
                  }

                  val prayerName = intent?.getStringExtra("prayer_name") ?: "الصلاة"
                  val modeId = intent?.getIntExtra("alert_mode", AlertMode.ATHAN_FULL.id) ?: AlertMode.ATHAN_FULL.id
                  val mode = AlertMode.fromId(modeId)

                  createChannel()
                  startForeground(NOTIF_ID, buildNotification(prayerName, mode))

                  when (mode) {
                      AlertMode.ATHAN_FULL -> playAudio(fullDuration = true)
                      AlertMode.NOTIFICATION_ONLY -> playAudio(fullDuration = false)
                      AlertMode.SILENT, AlertMode.OFF -> {
                          handler.postDelayed({
                              stopForeground(STOP_FOREGROUND_DETACH)
                              stopSelf()
                          }, 4_000L)
                      }
                  }

                  return START_NOT_STICKY
              }

              private fun playAudio(fullDuration: Boolean) {
                  stopPlayback()
                  val prefs = PrefsManager(this)
                  val customUri = prefs.customSoundUri?.let { Uri.parse(it) }
                  val defaultUri = RingtoneManager.getDefaultUri(
                      if (fullDuration) RingtoneManager.TYPE_ALARM else RingtoneManager.TYPE_NOTIFICATION
                  ) ?: RingtoneManager.getDefaultUri(RingtoneManager.TYPE_NOTIFICATION)

                  try {
                      mediaPlayer = MediaPlayer().apply {
                          setAudioAttributes(
                              AudioAttributes.Builder()
                                  .setUsage(AudioAttributes.USAGE_ALARM)
                                  .setContentType(AudioAttributes.CONTENT_TYPE_MUSIC)
                                  .build()
                          )
                          try {
                              setDataSource(this@AthanService, customUri ?: defaultUri)
                          } catch (_: Exception) {
                              setDataSource(this@AthanService, defaultUri)
                          }
                          isLooping = false
                          setOnCompletionListener {
                              stopForeground(STOP_FOREGROUND_REMOVE)
                              stopSelf()
                          }
                          prepare()
                          start()
                      }

                      val maxDuration = if (fullDuration) 180_000L else 12_000L
                      handler.postDelayed({
                          stopPlayback()
                          stopForeground(STOP_FOREGROUND_REMOVE)
                          stopSelf()
                      }, maxDuration)
                  } catch (_: Exception) {
                      stopForeground(STOP_FOREGROUND_DETACH)
                      stopSelf()
                  }
              }

              private fun stopPlayback() {
                  handler.removeCallbacksAndMessages(null)
                  mediaPlayer?.run {
                      try {
                          if (isPlaying) stop()
                          release()
                      } catch (_: Exception) {
                      }
                  }
                  mediaPlayer = null
              }

              private fun createChannel() {
                  val nm = getSystemService(NotificationManager::class.java)
                  if (nm.getNotificationChannel(CHANNEL_ID) == null) {
                      val ch = NotificationChannel(
                          CHANNEL_ID,
                          "تنبيهات الأذان ومواقيت الصلاة",
                          NotificationManager.IMPORTANCE_HIGH
                      ).apply {
                          description = "إشعارات الأذان وأوقات الصلوات"
                          setSound(null, null)
                      }
                      nm.createNotificationChannel(ch)
                  }
              }

              private fun buildNotification(prayerName: String, mode: AlertMode): Notification {
                  val openIntent = Intent(this, MainActivity::class.java)
                  val openPi = PendingIntent.getActivity(
                      this, 0, openIntent, PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE
                  )

                  val stopIntent = Intent(this, AthanService::class.java).apply {
                      action = ACTION_STOP_ATHAN
                  }
                  val stopPi = PendingIntent.getService(
                      this, 1, stopIntent, PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE
                  )

                  val title = if (prayerName == "الشروق") "حان الآن موعد الشروق" else "حان الآن موعد صلاة $prayerName"
                  val builder = NotificationCompat.Builder(this, CHANNEL_ID)
                      .setSmallIcon(android.R.drawable.ic_lock_idle_alarm)
                      .setContentTitle(title)
                      .setContentText("تقبل الله طاعتكم — الأذان برو")
                      .setPriority(NotificationCompat.PRIORITY_MAX)
                      .setCategory(NotificationCompat.CATEGORY_ALARM)
                      .setContentIntent(openPi)
                      .setAutoCancel(true)

                  if (mode == AlertMode.ATHAN_FULL || mode == AlertMode.NOTIFICATION_ONLY) {
                      builder.addAction(android.R.drawable.ic_media_pause, "إيقاف الصوت", stopPi)
                  }

                  return builder.build()
              }

              override fun onDestroy() {
                  stopPlayback()
                  super.onDestroy()
              }
          }
          EOF

          cat << 'EOF' > sensor/QiblaCompass.kt
          package com.athan.pro.sensor

          import android.content.Context
          import android.hardware.Sensor
          import android.hardware.SensorEvent
          import android.hardware.SensorEventListener
          import android.hardware.SensorManager
          import kotlin.math.*

          object QiblaMath {
              private const val KAABA_LAT = 21.422487
              private const val KAABA_LNG = 39.826206

              fun calculateQiblaBearing(lat: Double, lng: Double): Double {
                  val phi1 = Math.toRadians(lat)
                  val phi2 = Math.toRadians(KAABA_LAT)
                  val deltaLambda = Math.toRadians(KAABA_LNG - lng)
                  val y = sin(deltaLambda) * cos(phi2)
                  val x = cos(phi1) * sin(phi2) - sin(phi1) * cos(phi2) * cos(deltaLambda)
                  val theta = Math.toDegrees(atan2(y, x))
                  return (theta + 360.0) % 360.0
              }

              fun distanceToKaabaKm(lat: Double, lng: Double): Int {
                  val r = 6371.0
                  val dLat = Math.toRadians(KAABA_LAT - lat)
                  val dLng = Math.toRadians(KAABA_LNG - lng)
                  val a = sin(dLat / 2).pow(2) +
                      cos(Math.toRadians(lat)) * cos(Math.toRadians(KAABA_LAT)) * sin(dLng / 2).pow(2)
                  val c = 2 * atan2(sqrt(a), sqrt(1 - a))
                  return (r * c).roundToInt()
              }
          }

          class QiblaCompass(
              context: Context,
              private val onAzimuthChanged: (Float) -> Unit
          ) : SensorEventListener {
              private val sensorManager = context.getSystemService(Context.SENSOR_SERVICE) as SensorManager
              private val rotationSensor = sensorManager.getDefaultSensor(Sensor.TYPE_ROTATION_VECTOR)
              private val accelSensor = sensorManager.getDefaultSensor(Sensor.TYPE_ACCELEROMETER)
              private val magnetSensor = sensorManager.getDefaultSensor(Sensor.TYPE_MAGNETIC_FIELD)

              private val gravity = FloatArray(3)
              private val geomagnetic = FloatArray(3)
              private var hasGravity = false
              private var hasMagnet = false
              private var currentAzimuth = 0f

              val hasCompassHardware: Boolean
                  get() = rotationSensor != null || (accelSensor != null && magnetSensor != null)

              fun start() {
                  if (rotationSensor != null) {
                      sensorManager.registerListener(this, rotationSensor, SensorManager.SENSOR_DELAY_UI)
                  } else {
                      accelSensor?.let { sensorManager.registerListener(this, it, SensorManager.SENSOR_DELAY_UI) }
                      magnetSensor?.let { sensorManager.registerListener(this, it, SensorManager.SENSOR_DELAY_UI) }
                  }
              }

              fun stop() {
                  sensorManager.unregisterListener(this)
              }

              override fun onSensorChanged(event: SensorEvent) {
                  var rawAzimuth: Float? = null
                  if (event.sensor.type == Sensor.TYPE_ROTATION_VECTOR) {
                      val rMat = FloatArray(9)
                      val orientation = FloatArray(3)
                      SensorManager.getRotationMatrixFromVector(rMat, event.values)
                      SensorManager.getOrientation(rMat, orientation)
                      rawAzimuth = (Math.toDegrees(orientation[0].toDouble()).toFloat() + 360f) % 360f
                  } else if (event.sensor.type == Sensor.TYPE_ACCELEROMETER) {
                      System.arraycopy(event.values, 0, gravity, 0, 3)
                      hasGravity = true
                  } else if (event.sensor.type == Sensor.TYPE_MAGNETIC_FIELD) {
                      System.arraycopy(event.values, 0, geomagnetic, 0, 3)
                      hasMagnet = true
                  }

                  if (rawAzimuth == null && hasGravity && hasMagnet) {
                      val rMat = FloatArray(9)
                      val iMat = FloatArray(9)
                      if (SensorManager.getRotationMatrix(rMat, iMat, gravity, geomagnetic)) {
                          val orientation = FloatArray(3)
                          SensorManager.getOrientation(rMat, orientation)
                          rawAzimuth = (Math.toDegrees(orientation[0].toDouble()).toFloat() + 360f) % 360f
                      }
                  }

                  rawAzimuth?.let { target ->
                      val diff = ((target - currentAzimuth + 540f) % 360f) - 180f
                      currentAzimuth = (currentAzimuth + diff * 0.2f + 360f) % 360f
                      onAzimuthChanged(currentAzimuth)
                  }
              }

              override fun onAccuracyChanged(sensor: Sensor?, accuracy: Int) {}
          }
