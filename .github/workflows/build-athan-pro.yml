          package com.athan.pro.data

          import android.content.Context
          import android.content.SharedPreferences

          enum class AlertMode(val id: Int, val arabicName: String) {
              ATHAN_FULL(0, "صوت أذان / نغمة"),
              NOTIFICATION_ONLY(1, "إشعار مع تنبيه قصير"),
              SILENT(2, "إشعار صامت"),
              OFF(3, "معطل");

              companion object {
                  fun fromId(id: Int): AlertMode = entries.find { it.id == id } ?: ATHAN_FULL
              }
          }

          class PrefsManager(context: Context) {
              private val prefs: SharedPreferences =
                  context.getSharedPreferences("athan_pro_prefs", Context.MODE_PRIVATE)

              var cityName: String
                  get() = prefs.getString("city_name", "القاهرة") ?: "القاهرة"
                  set(value) = prefs.edit().putString("city_name", value).apply()

              var latitude: Double
                  get() = java.lang.Double.longBitsToDouble(
                      prefs.getLong("lat", java.lang.Double.doubleToRawLongBits(30.0444))
                  )
                  set(value) = prefs.edit().putLong("lat", java.lang.Double.doubleToRawLongBits(value)).apply()

              var longitude: Double
                  get() = java.lang.Double.longBitsToDouble(
                      prefs.getLong("lng", java.lang.Double.doubleToRawLongBits(31.2357))
                  )
                  set(value) = prefs.edit().putLong("lng", java.lang.Double.doubleToRawLongBits(value)).apply()

              var calculationMethod: CalculationMethod
                  get() = CalculationMethod.fromId(prefs.getInt("calc_method", CalculationMethod.EGYPT.id))
                  set(value) = prefs.edit().putInt("calc_method", value.id).apply()

              var asrJuristic: AsrJuristic
                  get() = AsrJuristic.fromId(prefs.getInt("asr_juristic", AsrJuristic.SHAFI.id))
                  set(value) = prefs.edit().putInt("asr_juristic", value.id).apply()

              var hijriAdjustment: Int
                  get() = prefs.getInt("hijri_adj", 0)
                  set(value) = prefs.edit().putInt("hijri_adj", value).apply()

              var darkTheme: Boolean
                  get() = prefs.getBoolean("dark_theme", false)
                  set(value) = prefs.edit().putBoolean("dark_theme", value).apply()

              var customSoundUri: String?
                  get() = prefs.getString("custom_sound_uri", null)
                  set(value) = prefs.edit().putString("custom_sound_uri", value).apply()

              var tasbeehTotal: Long
                  get() = prefs.getLong("tasbeeh_total", 0L)
                  set(value) = prefs.edit().putLong("tasbeeh_total", value).apply()

              fun getPrayerOffset(prayerId: PrayerId): Int =
                  prefs.getInt("offset_${prayerId.key}", 0)

              fun setPrayerOffset(prayerId: PrayerId, minutes: Int) {
                  prefs.edit().putInt("offset_${prayerId.key}", minutes).apply()
              }

              fun getAllOffsets(): Map<PrayerId, Int> =
                  PrayerId.entries.associateWith { getPrayerOffset(it) }

              fun getAlertMode(prayerId: PrayerId): AlertMode {
                  val defaultMode = if (prayerId == PrayerId.SUNRISE) AlertMode.NOTIFICATION_ONLY.id else AlertMode.ATHAN_FULL.id
                  return AlertMode.fromId(prefs.getInt("alert_${prayerId.key}", defaultMode))
              }

              fun setAlertMode(prayerId: PrayerId, mode: AlertMode) {
                  prefs.edit().putInt("alert_${prayerId.key}", mode.id).apply()
              }
          }
