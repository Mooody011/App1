          @Composable
          fun QiblaTab(prefs: PrefsManager) {
              val context = LocalContext.current
              val haptic = LocalHapticFeedback.current
              var azimuth by remember { mutableFloatStateOf(0f) }
              val qiblaBearing = remember(prefs.latitude, prefs.longitude) {
                  QiblaMath.calculateQiblaBearing(prefs.latitude, prefs.longitude).toFloat()
              }
              val distanceKm = remember(prefs.latitude, prefs.longitude) {
                  QiblaMath.distanceToKaabaKm(prefs.latitude, prefs.longitude)
              }

              val compass = remember {
                  QiblaCompass(context) { newAzimuth -> azimuth = newAzimuth }
              }

              DisposableEffect(Unit) {
                  compass.start()
                  onDispose { compass.stop() }
              }

              val relativeAngle = ((qiblaBearing - azimuth + 360f) % 360f)
              val isAligned = relativeAngle < 5f || relativeAngle > 355f
              var wasAligned by remember { mutableStateOf(false) }

              LaunchedEffect(isAligned) {
                  if (isAligned && !wasAligned) {
                      haptic.performHapticFeedback(HapticFeedbackType.LongPress)
                  }
                  wasAligned = isAligned
              }

              Column(
                  modifier = Modifier
                      .fillMaxSize()
                      .padding(20.dp),
                  horizontalAlignment = Alignment.CenterHorizontally,
                  verticalArrangement = Arrangement.Center
              ) {
                  Text("بوصلة القبلة", fontSize = 24.sp, fontWeight = FontWeight.Bold)
                  Spacer(Modifier.height(6.dp))
                  Text(
                      "المدينة: ${prefs.cityName} • المسافة للكعبة: $distanceKm كم",
                      fontSize = 14.sp,
                      color = Color.Gray
                  )
                  Spacer(Modifier.height(24.dp))

                  if (!compass.hasCompassHardware) {
                      Card(colors = CardDefaults.cardColors(containerColor = MaterialTheme.colorScheme.errorContainer)) {
                          Text(
                              "جهازك لا يحتوي على مستشعر بوصلة مغناطيسية. زاوية القبلة من الشمال الحقيقي هي ${qiblaBearing.toInt()}°.",
                              modifier = Modifier.padding(16.dp),
                              textAlign = TextAlign.Center
                          )
                      }
                  } else {
                      Box(
                          modifier = Modifier.size(270.dp),
                          contentAlignment = Alignment.Center
                      ) {
                          val ringColor = if (isAligned) Color(0xFF2E7D32) else MaterialTheme.colorScheme.primary
                          Canvas(modifier = Modifier.fillMaxSize()) {
                              val radius = size.minDimension / 2f
                              val center = Offset(size.width / 2f, size.height / 2f)

                              drawCircle(
                                  color = ringColor.copy(alpha = 0.15f),
                                  radius = radius,
                                  center = center
                              )
                              drawCircle(
                                  color = ringColor,
                                  radius = radius - 6f,
                                  center = center,
                                  style = Stroke(width = 8f)
                              )

                              rotate(degrees = -azimuth, pivot = center) {
                                  drawLine(
                                      color = Color.Red,
                                      start = center,
                                      end = Offset(center.x, center.y - radius + 28f),
                                      strokeWidth = 6f,
                                      cap = StrokeCap.Round
                                  )
                              }

                              rotate(degrees = qiblaBearing - azimuth, pivot = center) {
                                  drawLine(
                                      color = GoldAccent,
                                      start = center,
                                      end = Offset(center.x, center.y - radius + 24f),
                                      strokeWidth = 14f,
                                      cap = StrokeCap.Round
                                  )
                                  drawCircle(
                                      color = GoldAccent,
                                      radius = 16f,
                                      center = Offset(center.x, center.y - radius + 24f)
                                  )
                              }
                          }

                          Icon(
                              Icons.Default.Mosque,
                              contentDescription = "القبلة",
                              tint = if (isAligned) Color(0xFF2E7D32) else MaterialTheme.colorScheme.primary,
                              modifier = Modifier.size(44.dp)
                          )
                      }

                      Spacer(Modifier.height(24.dp))
                      Surface(
                          color = if (isAligned) Color(0xFF2E7D32) else MaterialTheme.colorScheme.surfaceVariant,
                          shape = RoundedCornerShape(16.dp)
                      ) {
                          Text(
                              if (isAligned) "أنت الآن متجه نحو القبلة تماماً"
                              else "زاوية القبلة: ${qiblaBearing.toInt()}° | انحرافك الحالي: ${abs(((relativeAngle + 180f) % 360f) - 180f).toInt()}°",
                              color = if (isAligned) Color.White else MaterialTheme.colorScheme.onSurfaceVariant,
                              modifier = Modifier.padding(horizontal = 18.dp, vertical = 10.dp),
                              fontWeight = FontWeight.SemiBold
                          )
                      }
                  }
              }
          }

          @Composable
          fun AdhkarTab() {
              var selectedCategory by remember { mutableStateOf(AdhkarRepository.categories.first()) }
              val filtered = remember(selectedCategory) {
                  AdhkarRepository.items.filter { it.category == selectedCategory }
              }
              val counts = remember { mutableStateMapOf<Int, Int>() }
              val haptic = LocalHapticFeedback.current

              Column(modifier = Modifier.fillMaxSize()) {
                  ScrollableTabRow(
                      selectedTabIndex = AdhkarRepository.categories.indexOf(selectedCategory),
                      edgePadding = 12.dp
                  ) {
                      AdhkarRepository.categories.forEach { cat ->
                          Tab(
                              selected = selectedCategory == cat,
                              onClick = { selectedCategory = cat },
                              text = { Text(cat, fontWeight = FontWeight.SemiBold) }
                          )
                      }
                  }

                  LazyColumn(
                      modifier = Modifier.fillMaxSize(),
                      contentPadding = PaddingValues(16.dp),
                      verticalArrangement = Arrangement.spacedBy(12.dp)
                  ) {
                      items(filtered, key = { it.id }) { item ->
                          val remaining = counts[item.id] ?: item.count
                          val done = remaining <= 0

                          Card(
                              modifier = Modifier
                                  .fillMaxWidth()
                                  .clickable(enabled = !done) {
                                      haptic.performHapticFeedback(HapticFeedbackType.TextHandleMove)
                                      counts[item.id] = (remaining - 1).coerceAtLeast(0)
                                  },
                              shape = RoundedCornerShape(16.dp),
                              colors = CardDefaults.cardColors(
                                  containerColor = if (done) EmeraldPrimary.copy(alpha = 0.12f) else MaterialTheme.colorScheme.surface
                              )
                          ) {
                              Column(modifier = Modifier.padding(16.dp), verticalArrangement = Arrangement.spacedBy(8.dp)) {
                                  Text(item.text, fontSize = 17.sp, lineHeight = 28.sp)
                                  Row(
                                      modifier = Modifier.fillMaxWidth(),
                                      horizontalArrangement = Arrangement.SpaceBetween,
                                      verticalAlignment = Alignment.CenterVertically
                                  ) {
                                      Text(item.virtue, fontSize = 12.sp, color = Color.Gray, modifier = Modifier.weight(1f))
                                      Row(verticalAlignment = Alignment.CenterVertically) {
                                          if (done) {
                                              IconButton(onClick = { counts[item.id] = item.count }) {
                                                  Icon(Icons.Default.Refresh, contentDescription = "إعادة", tint = EmeraldPrimary)
                                              }
                                          }
                                          Badge(
                                              containerColor = if (done) Color(0xFF2E7D32) else MaterialTheme.colorScheme.primary
                                          ) {
                                              Text(
                                                  if (done) "تم" else "$remaining",
                                                  color = Color.White,
                                                  modifier = Modifier.padding(horizontal = 8.dp, vertical = 4.dp),
                                                  fontSize = 14.sp
                                              )
                                          }
                                      }
                                  }
                              }
                          }
                      }
                  }
              }
          }

          @Composable
          fun TasbeehTab(prefs: PrefsManager) {
              val phrases = listOf(
                  "سُبْحَانَ اللَّهِ",
                  "الْحَمْدُ لِلَّهِ",
                  "اللَّهُ أَكْبَرُ",
                  "لَا إِلَهَ إِلَّا اللَّهُ",
                  "أَسْتَغْفِرُ اللَّهَ",
                  "اللَّهُمَّ صَلِّ عَلَى مُحَمَّدٍ"
              )
              var selectedPhrase by remember { mutableStateOf(phrases.first()) }
              var count by remember { mutableIntStateOf(0) }
              var total by remember { mutableLongStateOf(prefs.tasbeehTotal) }
              val haptic = LocalHapticFeedback.current

              Column(
                  modifier = Modifier
                      .fillMaxSize()
                      .padding(20.dp),
                  horizontalAlignment = Alignment.CenterHorizontally,
                  verticalArrangement = Arrangement.SpaceBetween
              ) {
                  Column(horizontalAlignment = Alignment.CenterHorizontally) {
                      Text("السبحة الإلكترونية", fontSize = 24.sp, fontWeight = FontWeight.Bold)
                      Spacer(Modifier.height(4.dp))
                      Text("المجموع الكلي: $total تسبيحة", fontSize = 14.sp, color = Color.Gray)
                      Spacer(Modifier.height(14.dp))

                      Row(
                          modifier = Modifier.fillMaxWidth(),
                          horizontalArrangement = Arrangement.spacedBy(8.dp)
                      ) {
                          phrases.take(3).forEach { phrase ->
                              FilterChip(
                                  selected = selectedPhrase == phrase,
                                  onClick = { selectedPhrase = phrase; count = 0 },
                                  label = { Text(phrase, fontSize = 11.sp) },
                                  modifier = Modifier.weight(1f)
                              )
                          }
                      }
                      Row(
                          modifier = Modifier.fillMaxWidth(),
                          horizontalArrangement = Arrangement.spacedBy(8.dp)
                      ) {
                          phrases.drop(3).forEach { phrase ->
                              FilterChip(
                                  selected = selectedPhrase == phrase,
                                  onClick = { selectedPhrase = phrase; count = 0 },
                                  label = { Text(phrase, fontSize = 11.sp) },
                                  modifier = Modifier.weight(1f)
                              )
                          }
                      }
                  }

                  Box(
                      modifier = Modifier
                          .size(220.dp)
                          .clip(CircleShape)
                          .background(Brush.radialGradient(listOf(EmeraldPrimary, EmeraldDark)))
                          .clickable {
                              count++
                              total++
                              prefs.tasbeehTotal = total
                              haptic.performHapticFeedback(
                                  if (count % 33 == 0) HapticFeedbackType.LongPress else HapticFeedbackType.TextHandleMove
                              )
                          },
                      contentAlignment = Alignment.Center
                  ) {
                      Column(horizontalAlignment = Alignment.CenterHorizontally) {
                          Text(selectedPhrase, color = GoldAccent, fontSize = 18.sp, fontWeight = FontWeight.Bold)
                          Spacer(Modifier.height(8.dp))
                          Text("$count", color = Color.White, fontSize = 52.sp, fontWeight = FontWeight.Bold)
                          Text("اضغط للتسبيح", color = Color.White.copy(alpha = 0.7f), fontSize = 12.sp)
                      }
                  }

                  OutlinedButton(
                      onClick = { count = 0 },
                      modifier = Modifier.fillMaxWidth(0.6f)
                  ) {
                      Icon(Icons.Default.Refresh, contentDescription = null)
                      Spacer(Modifier.width(6.dp))
                      Text("تصفير العداد الحالي")
                  }
              }
          }

          @Composable
          fun SettingsTab(
              prefs: PrefsManager,
              darkTheme: Boolean,
              onToggleTheme: (Boolean) -> Unit,
              onDataChanged: () -> Unit
          ) {
              val context = LocalContext.current
              var showCityDialog by remember { mutableStateOf(false) }
              var showMethodDialog by remember { mutableStateOf(false) }
              var cityName by remember { mutableStateOf(prefs.cityName) }
              var methodName by remember { mutableStateOf(prefs.calculationMethod.arabicName) }
              var statusMsg by remember { mutableStateOf<String?>(null) }

              val locationLauncher = rememberLauncherForActivityResult(
                  ActivityResultContracts.RequestMultiplePermissions()
              ) { grants ->
                  if (grants.values.any { it }) {
                      val lm = context.getSystemService(LocationManager::class.java)
                      val loc = try {
                          lm.getLastKnownLocation(LocationManager.GPS_PROVIDER)
                              ?: lm.getLastKnownLocation(LocationManager.NETWORK_PROVIDER)
                      } catch (_: SecurityException) {
                          null
                      }
                      if (loc != null) {
                          prefs.latitude = loc.latitude
                          prefs.longitude = loc.longitude
                          prefs.cityName = "موقعي الحالي (GPS)"
                          cityName = prefs.cityName
                          statusMsg = "تم تحديث الإحداثيات بنجاح"
                          onDataChanged()
                      } else {
                          statusMsg = "تعذر الحصول على آخر موقع، تأكد من تفعيل GPS أو اختر المدينة يدوياً"
                      }
                  }
              }

              val soundPicker = rememberLauncherForActivityResult(
                  ActivityResultContracts.OpenDocument()
              ) { uri ->
                  uri?.let {
                      try {
                          context.contentResolver.takePersistableUriPermission(
                              it,
                              Intent.FLAG_GRANT_READ_URI_PERMISSION
                          )
                      } catch (_: Exception) {
                      }
                      prefs.customSoundUri = it.toString()
                      statusMsg = "تم حفظ ملف الأذان المخصص بنجاح"
                  }
              }

              LazyColumn(
                  modifier = Modifier.fillMaxSize(),
                  contentPadding = PaddingValues(16.dp),
                  verticalArrangement = Arrangement.spacedBy(12.dp)
              ) {
                  item {
                      Text("الإعدادات", fontSize = 24.sp, fontWeight = FontWeight.Bold)
                  }

                  statusMsg?.let { msg ->
                      item {
                          Card(colors = CardDefaults.cardColors(containerColor = EmeraldPrimary.copy(alpha = 0.12f))) {
                              Text(msg, modifier = Modifier.padding(12.dp), fontSize = 13.sp)
                          }
                      }
                  }

                  item {
                      Card(shape = RoundedCornerShape(16.dp)) {
                          Column(modifier = Modifier.padding(16.dp), verticalArrangement = Arrangement.spacedBy(12.dp)) {
                              Text("الموقع والحساب الفلكي", fontWeight = FontWeight.Bold, color = MaterialTheme.colorScheme.primary)

                              Row(
                                  modifier = Modifier
                                      .fillMaxWidth()
                                      .clickable { showCityDialog = true },
                                  horizontalArrangement = Arrangement.SpaceBetween,
                                  verticalAlignment = Alignment.CenterVertically
                              ) {
                                  Column {
                                      Text("المدينة المختارة", fontWeight = FontWeight.Medium)
                                      Text(cityName, fontSize = 13.sp, color = Color.Gray)
                                  }
                                  Icon(Icons.Default.ChevronRight, contentDescription = null)
                              }

                              Button(
                                  onClick = {
                                      locationLauncher.launch(
                                          arrayOf(
                                              Manifest.permission.ACCESS_FINE_LOCATION,
                                              Manifest.permission.ACCESS_COARSE_LOCATION
                                          )
                                      )
                                  },
                                  modifier = Modifier.fillMaxWidth()
                              ) {
                                  Icon(Icons.Default.MyLocation, contentDescription = null)
                                  Spacer(Modifier.width(6.dp))
                                  Text("تحديد الموقع تلقائياً (GPS)")
                              }

                              Row(
                                  modifier = Modifier
                                      .fillMaxWidth()
                                      .clickable { showMethodDialog = true },
                                  horizontalArrangement = Arrangement.SpaceBetween,
                                  verticalAlignment = Alignment.CenterVertically
                              ) {
                                  Column(modifier = Modifier.weight(1f)) {
                                      Text("طريقة الحساب", fontWeight = FontWeight.Medium)
                                      Text(methodName, fontSize = 13.sp, color = Color.Gray)
                                  }
                                  Icon(Icons.Default.ChevronRight, contentDescription = null)
                              }

                              Row(
                                  modifier = Modifier.fillMaxWidth(),
                                  horizontalArrangement = Arrangement.SpaceBetween,
                                  verticalAlignment = Alignment.CenterVertically
                              ) {
                                  Text("المذهب الحنفي للعصر", fontWeight = FontWeight.Medium)
                                  var hanafi by remember { mutableStateOf(prefs.asrJuristic == AsrJuristic.HANAFI) }
                                  Switch(
                                      checked = hanafi,
                                      onCheckedChange = {
                                          hanafi = it
                                          prefs.asrJuristic = if (it) AsrJuristic.HANAFI else AsrJuristic.SHAFI
                                          onDataChanged()
                                      }
                                  )
                              }
                          }
                      }
                  }

                  item {
                      Card(shape = RoundedCornerShape(16.dp)) {
                          Column(modifier = Modifier.padding(16.dp), verticalArrangement = Arrangement.spacedBy(12.dp)) {
                              Text("الصوت والمظهر والصلاحيات", fontWeight = FontWeight.Bold, color = MaterialTheme.colorScheme.primary)

                              OutlinedButton(
                                  onClick = { soundPicker.launch(arrayOf("audio/*")) },
                                  modifier = Modifier.fillMaxWidth()
                              ) {
                                  Icon(Icons.Default.MusicNote, contentDescription = null)
                                  Spacer(Modifier.width(6.dp))
                                  Text("اختيار ملف صوت أذان (MP3) من الهاتف")
                              }

                              if (prefs.customSoundUri != null) {
                                  TextButton(
                                      onClick = {
                                          prefs.customSoundUri = null
                                          statusMsg = "تمت استعادة صوت التنبيه الافتراضي"
                                      }
                                  ) {
                                      Text("استعادة الصوت الافتراضي")
                                  }
                              }

                              Row(
                                  modifier = Modifier.fillMaxWidth(),
                                  horizontalArrangement = Arrangement.SpaceBetween,
                                  verticalAlignment = Alignment.CenterVertically
                              ) {
                                  Text("الوضع الليلي (Dark Mode)", fontWeight = FontWeight.Medium)
                                  Switch(
                                      checked = darkTheme,
                                      onCheckedChange = {
                                          prefs.darkTheme = it
                                          onToggleTheme(it)
                                      }
                                  )
                              }

                              if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.S) {
                                  OutlinedButton(
                                      onClick = {
                                          val i = Intent(Settings.ACTION_REQUEST_SCHEDULE_EXACT_ALARM).apply {
                                              data = Uri.parse("package:${context.packageName}")
                                          }
                                          context.startActivity(i)
                                      },
                                      modifier = Modifier.fillMaxWidth()
                                  ) {
                                      Icon(Icons.Default.AlarmOn, contentDescription = null)
                                      Spacer(Modifier.width(6.dp))
                                      Text("التحقق من صلاحية التنبيهات الدقيقة")
                                  }
                              }
                          }
                      }
                  }
              }

              if (showCityDialog) {
                  var query by remember { mutableStateOf("") }
                  val matches = remember(query) {
                      CitiesDatabase.cities.filter {
                          it.name.contains(query, ignoreCase = true) || it.country.contains(query, ignoreCase = true)
                      }
                  }
                  AlertDialog(
                      onDismissRequest = { showCityDialog = false },
                      title = { Text("اختر المدينة") },
                      text = {
                          Column(modifier = Modifier.heightIn(max = 360.dp)) {
                              OutlinedTextField(
                                  value = query,
                                  onValueChange = { query = it },
                                  label = { Text("بحث باسم المدينة أو الدولة") },
                                  singleLine = true,
                                  modifier = Modifier.fillMaxWidth()
                              )
                              Spacer(Modifier.height(8.dp))
                              LazyColumn {
                                  items(matches) { city ->
                                      ListItem(
                                          headlineContent = { Text(city.name) },
                                          supportingContent = { Text(city.country) },
                                          modifier = Modifier.clickable {
                                              prefs.cityName = city.name
                                              prefs.latitude = city.lat
                                              prefs.longitude = city.lng
                                              prefs.calculationMethod = city.defaultMethod
                                              cityName = city.name
                                              methodName = city.defaultMethod.arabicName
                                              showCityDialog = false
                                              onDataChanged()
                                          }
                                      )
                                  }
                              }
                          }
                      },
                      confirmButton = {
                          TextButton(onClick = { showCityDialog = false }) { Text("إغلاق") }
                      }
                  )
              }

              if (showMethodDialog) {
                  AlertDialog(
                      onDismissRequest = { showMethodDialog = false },
                      title = { Text("طريقة الحساب الفلكي") },
                      text = {
                          LazyColumn {
                              items(CalculationMethod.entries) { m ->
                                  ListItem(
                                      headlineContent = { Text(m.arabicName) },
                                      modifier = Modifier.clickable {
                                          prefs.calculationMethod = m
                                          methodName = m.arabicName
                                          showMethodDialog = false
                                          onDataChanged()
                                      }
                                  )
                              }
                          }
                      },
                      confirmButton = {
                          TextButton(onClick = { showMethodDialog = false }) { Text("إغلاق") }
                      }
                  )
              }
          }
          EOF

          cat << 'EOF' > MainActivity.kt
          package com.athan.pro

          import android.os.Bundle
          import androidx.activity.ComponentActivity
          import androidx.activity.compose.setContent
          import androidx.compose.runtime.*
          import androidx.compose.ui.platform.LocalLayoutDirection
          import androidx.compose.ui.unit.LayoutDirection
          import com.athan.pro.data.PrefsManager
          import com.athan.pro.ui.MainScreen
          import com.athan.pro.ui.theme.AthanProTheme

          class MainActivity : ComponentActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  val prefs = PrefsManager(this)
                  setContent {
                      var darkTheme by remember { mutableStateOf(prefs.darkTheme) }
                      CompositionLocalProvider(LocalLayoutDirection provides LayoutDirection.Rtl) {
                          AthanProTheme(darkTheme = darkTheme) {
                              MainScreen(
                                  darkTheme = darkTheme,
                                  onToggleTheme = { darkTheme = it }
                              )
                          }
                      }
                  }
              }
          }
          EOF

      - name: Build Signed Release APK
        run: |
          cd athan_pro
          gradle assembleRelease --no-daemon --stacktrace

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AthanPro-Release-APK
          path: athan_pro/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
