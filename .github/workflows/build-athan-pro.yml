          cd athan_pro/app/src/main/java/com/athan/pro

          cat << 'EOF' > alarm/AthanScheduler.kt
          package com.athan.pro.alarm

          import android.app.AlarmManager
          import android.app.PendingIntent
          import android.content.Context
          import android.content.Intent
          import android.os.Build
          import com.athan.pro.data.AlertMode
          import com.athan.pro.data.PrayerCalculator
          import com.athan.pro.data.PrayerId
          import com.athan.pro.data.PrefsManager
          import java.util.Calendar

          object AthanScheduler {
              fun scheduleAll(context: Context) {
                  val prefs = PrefsManager(context)
                  val alarmManager = context.getSystemService(Context.ALARM_SERVICE) as AlarmManager
                  val now = System.currentTimeMillis()
                  val tzHours = PrayerCalculator.currentTimeZoneHours()

                  val today = Calendar.getInstance()
                  val tomorrow = (today.clone() as Calendar).apply { add(Calendar.DAY_OF_MONTH, 1) }

                  val todayTimes = PrayerCalculator.calculateForDate(
                      today.get(Calendar.YEAR),
                      today.get(Calendar.MONTH) + 1,
                      today.get(Calendar.DAY_OF_MONTH),
                      prefs.latitude,
                      prefs.longitude,
                      tzHours,
                      prefs.calculationMethod,
                      prefs.asrJuristic,
                      prefs.getAllOffsets()
                  )

                  val tomorrowTimes = PrayerCalculator.calculateForDate(
                      tomorrow.get(Calendar.YEAR),
                      tomorrow.get(Calendar.MONTH) + 1,
                      tomorrow.get(Calendar.DAY_OF_MONTH),
                      prefs.latitude,
                      prefs.longitude,
                      tzHours,
                      prefs.calculationMethod,
                      prefs.asrJuristic,
                      prefs.getAllOffsets()
                  )

                  PrayerId.entries.forEachIndexed { index, prayerId ->
                      val mode = prefs.getAlertMode(prayerId)
                      val intent = Intent(context, AthanAlarmReceiver::class.java).apply {
                          putExtra("prayer_key", prayerId.key)
                          putExtra("prayer_name", prayerId.arabicName)
                          putExtra("alert_mode", mode.id)
                      }
                      val pendingIntent = PendingIntent.getBroadcast(
                          context,
                          100 + index,
                          intent,
                          PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE
                      )

                      if (mode == AlertMode.OFF) {
                          alarmManager.cancel(pendingIntent)
                          return@forEachIndexed
                      }

                      val todayMs = todayTimes.times[prayerId] ?: 0L
                      val targetMs = if (todayMs > now + 5_000L) {
                          todayMs
                      } else {
                          tomorrowTimes.times[prayerId] ?: 0L
                      }

                      if (targetMs > now) {
                          val canExact = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.S) {
                              alarmManager.canScheduleExactAlarms()
                          } else {
                              true
                          }

                          if (canExact) {
                              alarmManager.setExactAndAllowWhileIdle(
                                  AlarmManager.RTC_WAKEUP,
                                  targetMs,
                                  pendingIntent
                              )
                          } else {
                              alarmManager.setAndAllowWhileIdle(
                                  AlarmManager.RTC_WAKEUP,
                                  targetMs,
                                  pendingIntent
                              )
                          }
                      }
                  }
              }
          }
          EOF

