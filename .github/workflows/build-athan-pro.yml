      - name: Generate Data Layer (Astronomical Calculations, Hijri, Cities, Adhkar, Prefs)
        run: |
          cd athan_pro/app/src/main/java/com/athan/pro/data

          cat << 'EOF' > PrayerCalculator.kt
          package com.athan.pro.data

          import java.util.Calendar
          import java.util.TimeZone
          import kotlin.math.*

          enum class CalculationMethod(
              val id: Int,
              val arabicName: String,
              val fajrAngle: Double,
              val ishaAngle: Double,
              val ishaMinutesAfterMaghrib: Int? = null
          ) {
              EGYPT(0, "الهيئة المصرية العامة للمساحة", 19.5, 17.5),
              UMM_AL_QURA(1, "أم القرى (مكة المكرمة)", 18.5, 0.0, 90),
              MWL(2, "رابطة العالم الإسلامي", 18.0, 17.0),
              ISNA(3, "الجمعية الإسلامية لأمريكا الشمالية", 15.0, 15.0),
              KARACHI(4, "جامعة العلوم الإسلامية بكراتشي", 18.0, 18.0),
              GULF(5, "دول الخليج", 19.5, 0.0, 90);

              companion object {
                  fun fromId(id: Int): CalculationMethod = entries.find { it.id == id } ?: EGYPT
              }
          }

          enum class AsrJuristic(val id: Int, val arabicName: String, val factor: Int) {
              SHAFI(0, "الجمهور (الشافعي والمالكي والحنبلي)", 1),
              HANAFI(1, "الحنفي", 2);

              companion object {
                  fun fromId(id: Int): AsrJuristic = entries.find { it.id == id } ?: SHAFI
              }
          }

          enum class PrayerId(val key: String, val arabicName: String, val isFard: Boolean) {
              FAJR("fajr", "الفجر", true),
              SUNRISE("sunrise", "الشروق", false),
              DHUHR("dhuhr", "الظهر", true),
              ASR("asr", "العصر", true),
              MAGHRIB("maghrib", "المغرب", true),
              ISHA("isha", "العشاء", true)
          }

          data class DayPrayerTimes(
              val dateMillis: Long,
              val times: Map<PrayerId, Long>,
              val midnightMillis: Long,
              val lastThirdStartMillis: Long
          )

          object PrayerCalculator {
              fun calculateForDate(
                  year: Int,
                  month: Int,
                  day: Int,
                  latitude: Double,
                  longitude: Double,
                  timeZoneHours: Double,
                  method: CalculationMethod,
                  asrJuristic: AsrJuristic,
                  offsetsMinutes: Map<PrayerId, Int> = emptyMap()
              ): DayPrayerTimes {
                  val jd = julianDate(year, month, day) - longitude / (15.0 * 24.0)
                  val (decl, eqTime) = sunPosition(jd + 0.5)
                  val dhuhrHours = fixHour(12.0 + timeZoneHours - longitude / 15.0 - eqTime)

                  val fajrHours = sunAngleTime(method.fajrAngle, decl, latitude, dhuhrHours, ccw = true)
                  val sunriseHours = sunAngleTime(0.833, decl, latitude, dhuhrHours, ccw = true)
                  val sunsetHours = sunAngleTime(0.833, decl, latitude, dhuhrHours, ccw = false)
                  val asrHours = asrTime(asrJuristic.factor, decl, latitude, dhuhrHours)
                  val maghribHours = sunsetHours
                  val ishaHours = if (method.ishaMinutesAfterMaghrib != null) {
                      maghribHours + method.ishaMinutesAfterMaghrib / 60.0
                  } else {
                      sunAngleTime(method.ishaAngle, decl, latitude, dhuhrHours, ccw = false)
                  }

                  val cal = Calendar.getInstance().apply {
                      set(Calendar.YEAR, year)
                      set(Calendar.MONTH, month - 1)
                      set(Calendar.DAY_OF_MONTH, day)
                      set(Calendar.HOUR_OF_DAY, 0)
                      set(Calendar.MINUTE, 0)
                      set(Calendar.SECOND, 0)
                      set(Calendar.MILLISECOND, 0)
                  }
                  val baseMillis = cal.timeInMillis

                  fun toMillis(hours: Double, prayerId: PrayerId): Long {
                      val h = if (hours.isNaN()) 0.0 else hours
                      val offsetMin = offsetsMinutes[prayerId] ?: 0
                      val totalMinutes = (h * 60.0).roundToInt() + offsetMin
                      return baseMillis + totalMinutes * 60_000L
                  }

                  val fajrMs = toMillis(fajrHours, PrayerId.FAJR)
                  val sunriseMs = toMillis(sunriseHours, PrayerId.SUNRISE)
                  val dhuhrMs = toMillis(dhuhrHours, PrayerId.DHUHR)
                  val asrMs = toMillis(asrHours, PrayerId.ASR)
                  val maghribMs = toMillis(maghribHours, PrayerId.MAGHRIB)
                  val ishaMs = toMillis(ishaHours, PrayerId.ISHA)

                  val nextDayFajrMs = fajrMs + 24 * 3600_000L
                  val nightDuration = nextDayFajrMs - maghribMs
                  val midnightMs = maghribMs + nightDuration / 2
                  val lastThirdMs = nextDayFajrMs - nightDuration / 3

                  return DayPrayerTimes(
                      dateMillis = baseMillis,
                      times = mapOf(
                          PrayerId.FAJR to fajrMs,
                          PrayerId.SUNRISE to sunriseMs,
                          PrayerId.DHUHR to dhuhrMs,
                          PrayerId.ASR to asrMs,
                          PrayerId.MAGHRIB to maghribMs,
                          PrayerId.ISHA to ishaMs
                      ),
                      midnightMillis = midnightMs,
                      lastThirdStartMillis = lastThirdMs
                  )
              }

              fun currentTimeZoneHours(): Double {
                  val tz = TimeZone.getDefault()
                  return tz.getOffset(System.currentTimeMillis()) / 3_600_000.0
              }

              private fun julianDate(year: Int, month: Int, day: Int): Double {
                  var y = year
                  var m = month
                  if (m <= 2) {
                      y -= 1
                      m += 12
                  }
                  val a = floor(y / 100.0)
                  val b = 2 - a + floor(a / 4.0)
                  return floor(365.25 * (y + 4716)) + floor(30.6001 * (m + 1)) + day + b - 1524.5
              }

              private fun sunPosition(jd: Double): Pair<Double, Double> {
                  val d = jd - 2451545.0
                  val g = fixAngle(357.529 + 0.98560028 * d)
                  val q = fixAngle(280.459 + 0.98564736 * d)
                  val l = fixAngle(q + 1.915 * sinDeg(g) + 0.020 * sinDeg(2 * g))
                  val e = 23.439 - 0.00000036 * d
                  val ra = atan2Deg(cosDeg(e) * sinDeg(l), cosDeg(l)) / 15.0
                  val eqTime = q / 15.0 - fixHour(ra)
                  val decl = asinDeg(sinDeg(e) * sinDeg(l))
                  return decl to eqTime
              }

              private fun sunAngleTime(
                  angle: Double,
                  decl: Double,
                  lat: Double,
                  dhuhr: Double,
                  ccw: Boolean
              ): Double {
                  val top = -sinDeg(angle) - sinDeg(decl) * sinDeg(lat)
                  val bottom = cosDeg(decl) * cosDeg(lat)
                  val cosVal = (top / bottom).coerceIn(-1.0, 1.0)
                  val t = acosDeg(cosVal) / 15.0
                  return dhuhr + if (ccw) -t else t
              }

              private fun asrTime(factor: Int, decl: Double, lat: Double, dhuhr: Double): Double {
                  val angle = -acotDeg(factor + tanDeg(abs(lat - decl)))
                  return sunAngleTime(angle, decl, lat, dhuhr, ccw = false)
              }

              private fun sinDeg(d: Double) = sin(Math.toRadians(d))
              private fun cosDeg(d: Double) = cos(Math.toRadians(d))
              private fun tanDeg(d: Double) = tan(Math.toRadians(d))
              private fun asinDeg(x: Double) = Math.toDegrees(asin(x.coerceIn(-1.0, 1.0)))
              private fun acosDeg(x: Double) = Math.toDegrees(acos(x.coerceIn(-1.0, 1.0)))
              private fun atan2Deg(y: Double, x: Double) = Math.toDegrees(atan2(y, x))
              private fun acotDeg(x: Double) = Math.toDegrees(atan(1.0 / x))

              private fun fixAngle(a: Double): Double = a - 360.0 * floor(a / 360.0)
              private fun fixHour(h: Double): Double = h - 24.0 * floor(h / 24.0)
          }
          EOF

          cat << 'EOF' > HijriCalendar.kt
          package com.athan.pro.data

          import java.util.Calendar
          import kotlin.math.floor

          data class HijriDate(
              val day: Int,
              val month: Int,
              val year: Int,
              val monthName: String,
              val occasion: String? = null
          )

          object HijriCalendar {
              private val months = listOf(
                  "محرم", "صفر", "ربيع الأول", "ربيع الآخر",
                  "جمادى الأولى", "جمادى الآخرة", "رجب", "شعبان",
                  "رمضان", "شوال", "ذو القعدة", "ذو الحجة"
              )

              fun fromGregorian(cal: Calendar, adjustmentDays: Int = 0): HijriDate {
                  val adjusted = (cal.clone() as Calendar).apply {
                      add(Calendar.DAY_OF_MONTH, adjustmentDays)
                  }
                  val d = adjusted.get(Calendar.DAY_OF_MONTH)
                  val m = adjusted.get(Calendar.MONTH) + 1
                  val y = adjusted.get(Calendar.YEAR)

                  var jd = if ((y > 1582) || (y == 1582 && m > 10) || (y == 1582 && m == 10 && d > 14)) {
                      ((1461 * (y + 4800 + (m - 14) / 12)) / 4) +
                          ((367 * (m - 2 - 12 * ((m - 14) / 12))) / 12) -
                          ((3 * ((y + 4900 + (m - 14) / 12) / 100)) / 4) +
                          d - 32075
                  } else {
                      367 * y - ((7 * (y + 5001 + (m - 9) / 7)) / 4) +
                          ((275 * m) / 9) + d + 1729777
                  }

                  var l = jd - 1948440 + 10632
                  val n = floor((l - 1) / 10631.0).toInt()
                  l = l - 10631 * n + 354
                  val j = (floor((10985 - l) / 5316.0).toInt()) * (floor((50 * l) / 17719.0).toInt()) +
                      (floor(l / 5670.0).toInt()) * (floor((43 * l) / 15238.0).toInt())
                  l = l - (floor((30 - j) / 15.0).toInt()) * (floor((17719 * j) / 50.0).toInt()) -
                      (floor(j / 16.0).toInt()) * (floor((15238 * j) / 43.0).toInt()) + 29
                  val hMonth = floor((24 * l) / 709.0).toInt()
                  val hDay = l - floor((709 * hMonth) / 24.0).toInt()
                  val hYear = 30 * n + j - 30

                  val occasion = when (hMonth to hDay) {
                      1 to 1 -> "رأس السنة الهجرية"
                      1 to 10 -> "يوم عاشوراء"
                      3 to 12 -> "المولد النبوي الشريف"
                      7 to 27 -> "ليلة الإسراء والمعراج"
                      8 to 15 -> "ليلة النصف من شعبان"
                      9 to 1 -> "بداية شهر رمضان المبارك"
                      9 to 27 -> "ليلة السابع والعشرين من رمضان"
                      10 to 1 -> "عيد الفطر المبارك"
                      12 to 9 -> "يوم عرفة"
                      12 to 10 -> "عيد الأضحى المبارك"
                      else -> null
                  }

                  return HijriDate(
                      day = hDay,
                      month = hMonth,
                      year = hYear,
                      monthName = months.getOrElse(hMonth - 1) { "" },
                      occasion = occasion
                  )
              }
          }
          EOF

          cat << 'EOF' > CitiesDatabase.kt
