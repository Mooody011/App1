          <resources>
              <string name="app_name">الأذان برو</string>
              <string name="widget_description">مواقيت الصلاة والوقت المتبقي للصلاة القادمة</string>
          </resources>
          EOF

          cat << 'EOF' > app/src/main/res/values/themes.xml
          <resources>
              <style name="Theme.AthanPro" parent="android:Theme.Material.Light.NoActionBar" />
          </resources>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/ic_launcher_background.xml
