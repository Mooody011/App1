name: Build Full Athan APK
on:
  workflow_dispatch:
  push:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          channel: 'stable'
      - name: Generate Full App and Build APK
        run: |
          flutter create --platforms=android --org com.ashour.athan app
          cd app
          flutter pub add adhan geolocator shared_preferences intl flutter_local_notifications timezone
          python3 - << 'EOF'
          import os, wave, struct, math, re
          raw = "android/app/src/main/res/raw"
          os.makedirs(raw, exist_ok=True)
          with wave.open(f"{raw}/athan_alert.wav", "w") as w:
              w.setnchannels(1); w.setsampwidth(2); w.setframerate(44100)
              for i in range(44100 * 4):
                  t = i / 44100.0
                  f = 440.0 if t < 1.2 else (554.37 if t < 2.4 else 659.25)
                  v = int(16000 * math.exp(-1.5 * (t % 1.2)) * math.sin(2 * math.pi * f * t))
                  w.writeframesraw(struct.pack("<h", v))
          mp = "android/app/src/main/AndroidManifest.xml"
          m = open(mp).read()
          p = '<uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/><uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"/><uses-permission android:name="android.permission.POST_NOTIFICATIONS"/><uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM"/><uses-permission android:name="android.permission.USE_EXACT_ALARM"/><uses-permission android:name="android.permission.VIBRATE"/>'
          m = m.replace("<application", p + "<application", 1).replace('android:label="app"', 'android:label="مواقيت الأذان"')
          open(mp, "w").write(m)
          gp = "android/app/build.gradle"
          if os.path.exists(gp):
              g = open(gp).read()
              g = re.sub(r"compileSdk\s*=?\s*flutter\.compileSdkVersion", "compileSdk = 34", g)
              g = re.sub(r"minSdk\s*=?\s*flutter\.minSdkVersion", "minSdk = 21\n        multiDexEnabled = true", g)
              g = g.replace("compileOptions {", "compileOptions {\n        coreLibraryDesugaringEnabled = true", 1)
              g += "\ndependencies {\n    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.4'\n}\n"
              open(gp, "w").write(g)
          EOF
          cat << 'EOF' > lib/main.dart
          import 'dart:async';
          import 'dart:math' as math;
          import 'package:flutter/material.dart';
          import 'package:adhan/adhan.dart';
          import 'package:geolocator/geolocator.dart';
          import 'package:shared_preferences/shared_preferences.dart';
          import 'package:intl/intl.dart' hide TextDirection;
          import 'package:flutter_local_notifications/flutter_local_notifications.dart';
          import 'package:timezone/data/latest_all.dart' as tz;
          import 'package:timezone/timezone.dart' as tz;

          final notifs = FlutterLocalNotificationsPlugin();

          Future<void> main() async {
            WidgetsFlutterBinding.ensureInitialized();
            tz.initializeTimeZones();
            await notifs.initialize(const InitializationSettings(android: AndroidInitializationSettings('@mipmap/ic_launcher')));
            final ap = notifs.resolvePlatformSpecificImplementation<AndroidFlutterLocalNotificationsPlugin>();
            await ap?.requestNotificationsPermission();
            await ap?.requestExactAlarmsPermission();
            runApp(const AthanApp());
          }

          const cities = [
            ['الجيزة - حدائق الأهرام / أكتوبر', 29.9773, 31.0946],
            ['القاهرة الكبرى', 30.0444, 31.2357],
            ['الإسكندرية', 31.2001, 29.9187],
            ['المنصورة', 31.0409, 31.3785],
            ['طنطا', 30.7865, 31.0004],
            ['أسيوط', 27.1783, 31.1859],
            ['أسوان', 24.0889, 32.8998],
            ['مكة المكرمة', 21.4225, 39.8262],
            ['المدينة المنورة', 24.4672, 39.6112],
          ];

          const azkar = ['سبحان الله وبحمده', 'سبحان الله العظيم', 'الحمد لله', 'لا إله إلا الله', 'الله أكبر', 'أستغفر الله', 'اللهم صل وسلم على نبينا محمد'];

          class AthanApp extends StatelessWidget {
            const AthanApp({super.key});
            @override
            Widget build(BuildContext context) {
              return MaterialApp(
                debugShowCheckedModeBanner: false,
                theme: ThemeData.dark(useMaterial3: true).copyWith(
                  scaffoldBackgroundColor: const Color(0xFF0B1612),
                  colorScheme: ColorScheme.fromSeed(seedColor: const Color(0xFF10B981), brightness: Brightness.dark),
                ),
                builder: (c, ch) => Directionality(textDirection: TextDirection.rtl, child: ch!),
                home: const HomeScreen(),
              );
            }
          }

          class HomeScreen extends StatefulWidget {
            const HomeScreen({super.key});
            @override
            State<HomeScreen> createState() => _HomeScreenState();
          }

          class _HomeScreenState extends State<HomeScreen> {
            int tab = 0, tasbih = 0, total = 0, offset = 0;
            double lat = 29.9773, lng = 31.0946;
            String loc = 'الجيزة - حدائق الأهرام / أكتوبر', method = 'egyptian', madhab = 'shafi', zekr = azkar[0];
            bool notifOn = true;
            DateTime now = DateTime.now(), selDate = DateTime.now();
            Timer? timer;

            @override
            void initState() {
              super.initState();
              _load();
              timer = Timer.periodic(const Duration(seconds: 1), (_) => setState(() => now = DateTime.now()));
            }

            Future<void> _load() async {
              final p = await SharedPreferences.getInstance();
              setState(() {
                lat = p.getDouble('lat') ?? 29.9773; lng = p.getDouble('lng') ?? 31.0946;
                loc = p.getString('loc') ?? loc; method = p.getString('m') ?? 'egyptian';
                madhab = p.getString('md') ?? 'shafi'; total = p.getInt('tot') ?? 0;
                offset = p.getInt('off') ?? 0; notifOn = p.getBool('nf') ?? true;
              });
              _sched();
            }

            Future<void> _save() async {
              final p = await SharedPreferences.getInstance();
              p.setDouble('lat', lat); p.setDouble('lng', lng); p.setString('loc', loc);
              p.setString('m', method); p.setString('md', madhab); p.setInt('tot', total);
              p.setInt('off', offset); p.setBool('nf', notifOn);
              _sched();
            }

            PrayerTimes _calc(DateTime d) {
              final m = method == 'umm' ? CalculationMethod.umm_al_qura : (method == 'mwl' ? CalculationMethod.muslim_world_league : CalculationMethod.egyptian);
              final par = m.getParameters();
              par.madhab = madhab == 'hanafi' ? Madhab.hanafi : Madhab.shafi;
              par.adjustments..fajr = offset..sunrise = offset..dhuhr = offset..asr = offset..maghrib = offset..isha = offset;
              return PrayerTimes(Coordinates(lat, lng), DateComponents.from(d), par);
            }

            Future<void> _sched() async {
              await notifs.cancelAll();
              if (!notifOn) return;
              final pt = _calc(DateTime.now());
              final mp = {1: ['الفجر', pt.fajr], 2: ['الظهر', pt.dhuhr], 3: ['العصر', pt.asr], 4: ['المغرب', pt.maghrib], 5: ['العشاء', pt.isha]};
              const d = NotificationDetails(android: AndroidNotificationDetails('athan_v2', 'الأذان', importance: Importance.max, priority: Priority.high, sound: RawResourceAndroidNotificationSound('athan_alert')));
              for (final e in mp.entries) {
                final t = e.value[1] as DateTime;
                if (t.isAfter(DateTime.now())) {
                  try {
                    await notifs.zonedSchedule(e.key, 'حان الآن موعد أذان ${e.value[0]}', 'بتوقيت $loc', tz.TZDateTime.from(t, tz.local), d, androidScheduleMode: AndroidScheduleMode.exactAllowWhileIdle, uiLocalNotificationDateInterpretation: UILocalNotificationDateInterpretation.absoluteTime);
                  } catch (_) {}
                }
              }
            }

            Future<void> _gps() async {
              try {
                await Geolocator.requestPermission();
                final pos = await Geolocator.getCurrentPosition();
                setState(() { lat = pos.latitude; lng = pos.longitude; loc = 'GPS (${lat.toStringAsFixed(2)}, ${lng.toStringAsFixed(2)})'; });
                _save();
              } catch (_) {}
            }

            @override
            Widget build(BuildContext context) {
              final pt = _calc(selDate), nowPt = _calc(now);
              final curList = [['الفجر', nowPt.fajr], ['الشروق', nowPt.sunrise], ['الظهر', nowPt.dhuhr], ['العصر', nowPt.asr], ['المغرب', nowPt.maghrib], ['العشاء', nowPt.isha]];
              final viewList = [['الفجر', pt.fajr], ['الشروق', pt.sunrise], ['الظهر', pt.dhuhr], ['العصر', pt.asr], ['المغرب', pt.maghrib], ['العشاء', pt.isha]];
              var nextName = 'الفجر (غداً)', nextTime = _calc(now.add(const Duration(days: 1))).fajr;
              for (final i in curList) {
                if ((i[1] as DateTime).isAfter(now)) { nextName = i[0] as String; nextTime = i[1] as DateTime; break; }
              }
              final d = nextTime.difference(now);
              final cd = '${d.inHours.toString().padLeft(2, '0')}:${(d.inMinutes % 60).toString().padLeft(2, '0')}:${(d.inSeconds % 60).toString().padLeft(2, '0')}';
              final tf = DateFormat('hh:mm a'), qibla = Qibla(Coordinates(lat, lng)).direction;

              final views = [
                ListView(padding: const EdgeInsets.all(16), children: [
                  Container(
                    padding: const EdgeInsets.all(18),
                    decoration: BoxDecoration(color: const Color(0xFF065F46), borderRadius: BorderRadius.circular(16)),
                    child: Column(children: [
                      Text(loc, style: const TextStyle(color: Colors.white70)),
                      Text('الصلاة القادمة: $nextName', style: const TextStyle(fontSize: 20, fontWeight: FontWeight.bold)),
                      Text(cd, style: const TextStyle(fontSize: 38, fontWeight: FontWeight.bold, color: Color(0xFFFBBF24))),
                      Text(DateFormat('yyyy-MM-dd').format(selDate), style: const TextStyle(color: Colors.white70)),
                    ]),
                  ),
                  Row(mainAxisAlignment: MainAxisAlignment.spaceBetween, children: [
                    TextButton(onPressed: () => setState(() => selDate = selDate.subtract(const Duration(days: 1))), child: const Text('اليوم السابق')),
                    TextButton(onPressed: () => setState(() => selDate = DateTime.now()), child: const Text('اليوم')),
                    TextButton(onPressed: () => setState(() => selDate = selDate.add(const Duration(days: 1))), child: const Text('اليوم التالي')),
                  ]),
                  ...viewList.map((r) => Card(
                    color: nextName == r[0] ? const Color(0xFF064E3B) : const Color(0xFF13261F),
                    child: ListTile(
                      title: Text(r[0] as String, style: const TextStyle(fontSize: 18, fontWeight: FontWeight.bold)),
                      trailing: Text(tf.format(r[1] as DateTime), style: const TextStyle(fontSize: 18, color: Color(0xFFFBBF24))),
                    ),
                  )),
                ]),
                Center(child: Column(mainAxisAlignment: MainAxisAlignment.center, children: [
                  const Text('زاوية اتجاه القبلة من الشمال الحقيقي', style: TextStyle(fontSize: 18)),
                  Text('${qibla.toStringAsFixed(1)}°', style: const TextStyle(fontSize: 36, fontWeight: FontWeight.bold, color: Color(0xFFFBBF24))),
                  const SizedBox(height: 20),
                  Transform.rotate(angle: qibla * (math.pi / 180), child: const Icon(Icons.navigation, size: 110, color: Color(0xFF10B981))),
                ])),
                Padding(padding: const EdgeInsets.all(20), child: Column(mainAxisAlignment: MainAxisAlignment.center, children: [
                  DropdownButtonFormField<String>(
                    value: zekr, decoration: const InputDecoration(border: OutlineInputBorder()),
                    items: azkar.map((z) => DropdownMenuItem(value: z, child: Text(z))).toList(),
                    onChanged: (v) { if (v != null) setState(() => zekr = v); },
                  ),
                  const SizedBox(height: 28),
                  GestureDetector(
                    onTap: () { setState(() { tasbih++; total++; }); _save(); },
                    child: CircleAvatar(radius: 85, backgroundColor: const Color(0xFF065F46), child: Text('$tasbih', style: const TextStyle(fontSize: 46, color: Color(0xFFFBBF24)))),
                  ),
                  const SizedBox(height: 20),
                  OutlinedButton(onPressed: () => setState(() => tasbih = 0), child: Text('تصفير العداد (الإجمالي: $total)')),
                ])),
                ListView(padding: const EdgeInsets.all(16), children: [
                  DropdownButtonFormField<List<Object>>(
                    decoration: const InputDecoration(labelText: 'اختر المدينة', border: OutlineInputBorder()),
                    items: cities.map((c) => DropdownMenuItem(value: c, child: Text(c[0] as String))).toList(),
                    onChanged: (c) { if (c != null) { setState(() { loc = c[0] as String; lat = c[1] as double; lng = c[2] as double; }); _save(); } },
                  ),
                  const SizedBox(height: 12),
                  DropdownButtonFormField<String>(
                    value: method, decoration: const InputDecoration(labelText: 'طريقة الحساب', border: OutlineInputBorder()),
                    items: const [
                      DropdownMenuItem(value: 'egyptian', child: Text('الهيئة المصرية العامة للمساحة')),
                      DropdownMenuItem(value: 'umm', child: Text('تقويم أم القرى')),
                      DropdownMenuItem(value: 'mwl', child: Text('رابطة العالم الإسلامي')),
                    ],
                    onChanged: (v) { if (v != null) { setState(() => method = v); _save(); } },
                  ),
                  const SizedBox(height: 12),
                  DropdownButtonFormField<String>(
                    value: madhab, decoration: const InputDecoration(labelText: 'المذهب (العصر)', border: OutlineInputBorder()),
                    items: const [DropdownMenuItem(value: 'shafi', child: Text('الجمهور (شافعي)')), DropdownMenuItem(value: 'hanafi', child: Text('حنفي'))],
                    onChanged: (v) { if (v != null) { setState(() => madhab = v); _save(); } },
                  ),
                  const SizedBox(height: 12),
                  Text('تعديل يدوي للدقائق: $offset د'),
                  Slider(value: offset.toDouble(), min: -60, max: 60, divisions: 120, onChanged: (v) { setState(() => offset = v.round()); _save(); }),
                  SwitchListTile(title: const Text('تفعيل إشعارات وصوت الأذان'), value: notifOn, onChanged: (v) { setState(() => notifOn = v); _save(); }),
                  ElevatedButton.icon(
                    onPressed: () => notifs.show(99, 'اختبار الأذان', 'الصوت يعمل بنجاح', const NotificationDetails(android: AndroidNotificationDetails('athan_v2', 'الأذان', importance: Importance.max, sound: RawResourceAndroidNotificationSound('athan_alert')))),
                    icon: const Icon(Icons.volume_up), label: const Text('تجربة إشعار وصوت الأذان الآن'),
                  ),
                ]),
              ];

              return Scaffold(
                appBar: AppBar(title: const Text('مواقيت الأذان والقبلة'), actions: [IconButton(onPressed: _gps, icon: const Icon(Icons.my_location, color: Color(0xFF10B981)))]),
                body: views[tab],
                bottomNavigationBar: NavigationBar(
                  selectedIndex: tab, onDestinationSelected: (i) => setState(() => tab = i),
                  destinations: const [
                    NavigationDestination(icon: Icon(Icons.access_time), label: 'المواقيت'),
                    NavigationDestination(icon: Icon(Icons.explore), label: 'القبلة'),
                    NavigationDestination(icon: Icon(Icons.spa), label: 'السبحة'),
                    NavigationDestination(icon: Icon(Icons.settings), label: 'الإعدادات'),
                  ],
                ),
              );
            }
          }
          EOF
          flutter build apk --release
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AthanPro-Full-APK
          path: app/build/app/outputs/flutter-apk/app-release.apk
          
